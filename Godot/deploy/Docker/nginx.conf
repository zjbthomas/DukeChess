server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    types {
        application/wasm wasm;
        application/octet-stream pck;
    }

    # Godot 4 threads (SharedArrayBuffer) requires cross-origin isolation
    # Keep these consistent on ALL responses.
    set $coop "same-origin";
    set $coep "require-corp";
    set $corp "cross-origin";

    location / {
        add_header Cross-Origin-Opener-Policy $coop always;
        add_header Cross-Origin-Embedder-Policy $coep always;
        add_header Cross-Origin-Resource-Policy $corp always;

        try_files $uri $uri/ =404;
    }

    # Static assets (must repeat headers here because nginx add_header inheritance is tricky)
    location ~* \.(wasm|pck|js|mjs|css|json|png|jpg|jpeg|svg|ico)$ {
        add_header Cross-Origin-Opener-Policy $coop always;
        add_header Cross-Origin-Embedder-Policy $coep always;
        add_header Cross-Origin-Resource-Policy $corp always;

        # During dev, you can comment this out to avoid caching headaches
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        try_files $uri =404;
    }
}